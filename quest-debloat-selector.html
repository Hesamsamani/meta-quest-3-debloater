<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meta Quest 3 Debloat & Privacy Selector</title>
  <style>
    :root {
      --bg: #0b0f17; --surface: #131a26; --hover: #1a2436; --border: #263248;
      --text: #f1f5f9; --muted: #94a3b8; --blue: #3b82f6; --green: #10b981;
      --amber: #f59e0b; --orange: #f97316; --red: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); padding: 28px; max-width: 1280px; margin: 0 auto; }
    header { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px 24px; margin-bottom: 18px; }
    h1 { font-size: 22px; margin-bottom: 6px; }
    .sub { color: var(--muted); font-size: 14px; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 16px; }
    button { background: var(--hover); color: var(--text); border: 1px solid var(--border); padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 13px; }
    button:hover { border-color: var(--blue); }
    button.safe { background: var(--green); color: #051b11; border-color: var(--green); }
    button.tel { background: var(--blue); border-color: var(--blue); }
    button.pcvr { background: var(--amber); color: #1c1102; border-color: var(--amber); }
    input[type=text] { background: var(--surface); color: var(--text); border: 1px solid var(--border); padding: 8px 12px; border-radius: 8px; min-width: 240px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 12px; margin-bottom: 24px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px; display: flex; gap: 12px; align-items: flex-start; }
    .card.locked { opacity: .65; border-color: rgba(239,68,68,.4); }
    .badge { font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 999px; margin-left: 6px; }
    .SAFE { background: rgba(16,185,129,.18); color: var(--green); }
    .MODERATE { background: rgba(245,158,11,.18); color: var(--amber); }
    .CAUTION { background: rgba(249,115,22,.18); color: var(--orange); }
    .PROTECTED { background: rgba(239,68,68,.18); color: var(--red); }
    .pkg { font-family: ui-monospace, Consolas, monospace; font-size: 12px; color: var(--blue); margin: 3px 0; word-break: break-all; }
    .desc { font-size: 12.5px; color: var(--muted); }
    .out { background: #090d14; border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
    pre { font-family: ui-monospace, Consolas, monospace; font-size: 12.5px; white-space: pre-wrap; color: #cbd5e1; max-height: 280px; overflow: auto; margin-top: 10px; }
  </style>
</head>
<body>
  <header>
    <h1>Meta Quest 3 Debloat & Privacy Selector</h1>
    <div class="sub">Select telemetry, social apps, and Horizon OS bloatware to disable reversibly via ADB (<code>pm disable-user --user 0</code>). Protected OS packages are hard-locked.</div>
  </header>
  <div class="toolbar">
    <button class="safe" onclick="selectPreset('safe')">Safe Recommended</button>
    <button class="tel" onclick="selectPreset('telemetry')">Telemetry & Ads Only</button>
    <button class="pcvr" onclick="selectPreset('pcvr')">PCVR / Minimalist</button>
    <button onclick="selectPreset('none')">Clear Selection</button>
    <input id="q" type="text" placeholder="Search package or description..." oninput="render()" />
    <span id="count" class="sub"></span>
  </div>
  <div id="grid" class="grid"></div>
  <div class="out">
    <div class="toolbar" style="margin-bottom:4px">
      <strong>Generated ADB Commands</strong>
      <button onclick="copyScript('disable')">Copy Disable Script</button>
      <button onclick="copyScript('restore')">Copy Undo / Restore Script</button>
    </div>
    <pre id="script"></pre>
  </div>
  <script>
    const PACKAGES = [{"package": "com.meta.horizonadidservice", "name": "Meta Horizon Ad ID Service", "category": "Telemetry & Ads", "tier": "SAFE", "presets": ["telemetry", "safe", "pcvr"], "description": "Meta Horizon advertising identifier tracking and ad attribution service."}, {"package": "com.meta.federatedcomputing.oculus", "name": "Meta Federated Computing", "category": "Telemetry & Ads", "tier": "SAFE", "presets": ["telemetry", "safe", "pcvr"], "description": "Background federated machine learning and telemetry model training."}, {"package": "com.android.adservices.api", "name": "Android AdServices API", "category": "Telemetry & Ads", "tier": "SAFE", "presets": ["telemetry", "safe", "pcvr"], "description": "Android Privacy Sandbox ad targeting and attribution API."}, {"package": "com.android.ext.adservices.api", "name": "Android Extended AdServices", "category": "Telemetry & Ads", "tier": "SAFE", "presets": ["telemetry", "safe", "pcvr"], "description": "Extended Android Privacy Sandbox advertising background service."}, {"package": "com.android.ondevicepersonalization.services", "name": "On-Device Ad Personalization", "category": "Telemetry & Ads", "tier": "SAFE", "presets": ["telemetry", "safe", "pcvr"], "description": "On-device behavioral ad personalization engine."}, {"package": "com.android.federatedcompute.services", "name": "Android Federated Compute", "category": "Telemetry & Ads", "tier": "SAFE", "presets": ["telemetry", "safe", "pcvr"], "description": "Background Android federated telemetry training daemon."}, {"package": "com.oculus.bugreportuploader", "name": "Oculus Bug Report Uploader", "category": "Telemetry & Ads", "tier": "SAFE", "presets": ["telemetry", "safe", "pcvr"], "description": "Background diagnostic dump and crash log uploader to Meta servers."}, {"package": "com.oculus.bugreportservice", "name": "Oculus Bug Report Service", "category": "Telemetry & Ads", "tier": "SAFE", "presets": ["telemetry", "safe", "pcvr"], "description": "Background diagnostic capture and bug report collection daemon."}, {"package": "com.oculus.quickpromotionservice", "name": "Quick Promotion / Upsells", "category": "Telemetry & Ads", "tier": "SAFE", "presets": ["telemetry", "safe", "pcvr"], "description": "Pushes promotional banners, Horizon+ upsells, and modal prompts in VR."}, {"package": "com.oculus.nux.ota", "name": "Post-Update Onboarding Prompts", "category": "Telemetry & Ads", "tier": "SAFE", "presets": ["telemetry", "safe", "pcvr"], "description": "Post-OTA new-user experience onboarding and promotional cards."}, {"package": "com.oculus.backuptransportservice", "name": "Meta Cloud Backup Transport", "category": "Telemetry & Ads", "tier": "SAFE", "presets": ["telemetry", "safe", "pcvr"], "description": "Cloud app backup sync transport to Meta servers (ADB backup unaffected)."}, {"package": "com.oculus.q4b.mdm", "name": "Quest for Business MDM", "category": "Telemetry & Ads", "tier": "SAFE", "presets": ["telemetry", "safe", "pcvr"], "description": "Enterprise Mobile Device Management agent (unused on consumer headsets)."}, {"package": "com.facebook.wearable.system.location.service", "name": "Wearable Location Service", "category": "Telemetry & Ads", "tier": "SAFE", "presets": ["telemetry", "safe", "pcvr"], "description": "Resident background wearable location tracking service (~110 MB RSS)."}, {"package": "com.facebook.wearable.system.location.proxy", "name": "Wearable Location Proxy", "category": "Telemetry & Ads", "tier": "SAFE", "presets": ["telemetry", "safe", "pcvr"], "description": "Resident background proxy for Meta wearable location polling (~87 MB RSS)."}, {"package": "com.facebook.horizon", "name": "Meta Horizon Worlds", "category": "Social & Horizon", "tier": "SAFE", "presets": ["safe", "pcvr"], "description": "Preinstalled Meta Horizon Worlds client and Horizon Feed integration."}, {"package": "com.oculus.facebook", "name": "Facebook VR App", "category": "Social & Horizon", "tier": "SAFE", "presets": ["safe", "pcvr"], "description": "Preinstalled Facebook social VR wrapper application."}, {"package": "com.oculus.igvr", "name": "Instagram VR App", "category": "Social & Horizon", "tier": "SAFE", "presets": ["safe", "pcvr"], "description": "Preinstalled Instagram VR wrapper application."}, {"package": "com.oculus.thvr", "name": "Threads VR App", "category": "Social & Horizon", "tier": "SAFE", "presets": ["safe", "pcvr"], "description": "Preinstalled Threads social media VR wrapper application."}, {"package": "com.facebook.arvr.quillplayer", "name": "Theater Elsewhere / Quill Player", "category": "Bloat & Demos", "tier": "SAFE", "presets": ["safe", "pcvr"], "description": "Preinstalled Quill VR animation viewer and Showcase demos."}, {"package": "com.oculus.samples.firsthand", "name": "First Hand Demo", "category": "Bloat & Demos", "tier": "SAFE", "presets": ["safe", "pcvr"], "description": "Preinstalled Meta hand-tracking onboarding demonstration app."}, {"package": "com.meta.handseducationmodule", "name": "Hands Education Module", "category": "Bloat & Demos", "tier": "SAFE", "presets": ["safe", "pcvr"], "description": "Interactive tutorial overlay for Quest hand gestures."}, {"package": "com.meta.curio.ruler", "name": "Curio Mixed-Reality Ruler", "category": "Bloat & Demos", "tier": "SAFE", "presets": ["safe", "pcvr"], "description": "Preinstalled MR ruler novelty utility."}, {"package": "com.meta.curio.toybox", "name": "Curio Mixed-Reality Toybox", "category": "Bloat & Demos", "tier": "SAFE", "presets": ["safe", "pcvr"], "description": "Preinstalled MR toybox novelty mini-app."}, {"package": "com.oculus.assistant", "name": "Meta Voice Assistant", "category": "Bloat & Demos", "tier": "SAFE", "presets": ["safe", "pcvr"], "description": "Meta voice command listener and assistant background daemon."}, {"package": "com.oculus.guidebook", "name": "Quest Guidebook", "category": "Bloat & Demos", "tier": "SAFE", "presets": ["safe", "pcvr"], "description": "Resident background tips & onboarding guidebook service (~112 MB RSS)."}, {"package": "com.oculus.helpcenter", "name": "Meta Help Center", "category": "Bloat & Demos", "tier": "SAFE", "presets": ["safe", "pcvr"], "description": "Meta support articles & troubleshooting viewer (~118 MB cached RSS)."}, {"package": "com.oculus.vrprivacycheckup", "name": "VR Privacy Checkup Prompts", "category": "Bloat & Demos", "tier": "SAFE", "presets": ["safe", "pcvr"], "description": "Periodic Meta privacy checkup wizard notifications."}, {"package": "com.oculus.panelapp.calendar", "name": "Oculus Calendar Panel", "category": "Bloat & Demos", "tier": "SAFE", "presets": ["safe", "pcvr"], "description": "Legacy Horizon Home calendar dock widget."}, {"package": "com.oculus.socialplatform", "name": "Oculus Social Platform", "category": "Social & Horizon", "tier": "MODERATE", "presets": ["pcvr"], "description": "Parties, voice calls, friends status, and social feed notifications (~127 MB RSS)."}, {"package": "com.oculus.presence", "name": "Live User Presence Service", "category": "Social & Horizon", "tier": "MODERATE", "presets": ["pcvr"], "description": "Reports active app and online presence state to Meta friends list."}, {"package": "com.oculus.avatareditor", "name": "Meta Avatar Editor", "category": "Social & Horizon", "tier": "MODERATE", "presets": ["pcvr"], "description": "3D Meta Avatar customization editor (heavy memory footprint when loaded)."}, {"package": "com.oculus.tv", "name": "Meta Quest TV", "category": "Bloat & Demos", "tier": "MODERATE", "presets": ["pcvr"], "description": "Preinstalled Meta Quest TV 180/360 media streaming app."}, {"package": "com.oculus.remotedesktop", "name": "Meta Remote Desktop", "category": "Bloat & Demos", "tier": "MODERATE", "presets": ["pcvr"], "description": "Built-in Meta Workrooms remote desktop panel (safe if using Virtual Desktop)."}, {"package": "com.oculus.accountscenter", "name": "Meta Accounts Center App", "category": "Social & Horizon", "tier": "MODERATE", "presets": ["pcvr"], "description": "Cross-app Meta/Facebook/Instagram account linking UI."}, {"package": "com.meta.AccountsCenter.pwa", "name": "Meta Accounts Center PWA", "category": "Social & Horizon", "tier": "MODERATE", "presets": ["pcvr"], "description": "Web wrapper companion for Meta Accounts Center."}, {"package": "com.meta.shell.env.vista.calming", "name": "Home Env: Calming", "category": "Environments", "tier": "MODERATE", "presets": ["pcvr"], "description": "Extra Vista Home virtual environment theme (keeps default Haven 2025 intact)."}, {"package": "com.meta.shell.env.vista.focused", "name": "Home Env: Focused", "category": "Environments", "tier": "MODERATE", "presets": ["pcvr"], "description": "Extra Vista Home virtual environment theme (keeps default Haven 2025 intact)."}, {"package": "com.meta.shell.env.vista.horror", "name": "Home Env: Horror", "category": "Environments", "tier": "MODERATE", "presets": ["pcvr"], "description": "Extra Vista Home virtual environment theme (keeps default Haven 2025 intact)."}, {"package": "com.meta.shell.env.vista.oceanarium", "name": "Home Env: Oceanarium", "category": "Environments", "tier": "MODERATE", "presets": ["pcvr"], "description": "Extra Vista Home virtual environment theme (keeps default Haven 2025 intact)."}, {"package": "com.oculus.store", "name": "Meta Horizon Store", "category": "Caution", "tier": "CAUTION", "presets": [], "description": "Official Store UI (~237 MB resident RAM). Only disable if using sideloading/PCVR only."}, {"package": "com.oculus.browser", "name": "Meta Quest Browser", "category": "Caution", "tier": "CAUTION", "presets": [], "description": "Default WebXR Chromium browser. Safe to keep unless replaced by another browser."}, {"package": "com.oculus.hzosgallery", "name": "Horizon OS Media Gallery", "category": "Caution", "tier": "CAUTION", "presets": [], "description": "Screenshot and spatial video gallery viewer (~120 MB RSS)."}, {"package": "com.oculus.magicislandcastingservice", "name": "Meta Native Casting Service", "category": "Caution", "tier": "CAUTION", "presets": [], "description": "Horizon OS native casting daemon (VRmoo uses ADB/scrcpy instead)."}, {"package": "com.oculus.xrstreamingclient", "name": "Meta Quest Link / Air Link", "category": "Caution", "tier": "CAUTION", "presets": [], "description": "Official wired Link / wireless Air Link client (safe to disable if using Virtual Desktop / ALVR)."}, {"package": "com.meta.pclinkservice.server", "name": "Meta PC Link Server", "category": "Caution", "tier": "CAUTION", "presets": [], "description": "PC Link discovery server companion on the headset."}, {"package": "com.oculus.appsafety", "name": "App Safety Integrity Monitor", "category": "Caution", "tier": "CAUTION", "presets": [], "description": "Checks sideloaded/unofficial apps against Meta safety policies (~121 MB RSS)."}, {"package": "com.oculus.websafety", "name": "Web Safety Filter", "category": "Caution", "tier": "CAUTION", "presets": [], "description": "URL safety scanner used by Meta Quest Browser links."}, {"package": "com.oculus.vrshell", "name": "Horizon OS VR Shell (HOME)", "category": "Protected", "tier": "PROTECTED", "presets": [], "description": "Primary VR launcher & compositor host. Disabling bricks headset UI."}, {"package": "com.oculus.systemux", "name": "SystemUX Universal Menu", "category": "Protected", "tier": "PROTECTED", "presets": [], "description": "Core Universal Menu, Quick Settings, dialogs, and overlays."}, {"package": "com.oculus.systemdriver", "name": "Oculus System Driver", "category": "Protected", "tier": "PROTECTED", "presets": [], "description": "6DoF headset/controller tracking and core hardware runtime driver."}, {"package": "com.oculus.systemactivities", "name": "Oculus System Activities", "category": "Protected", "tier": "PROTECTED", "presets": [], "description": "Core VR permission prompts and power/exit dialogs."}, {"package": "com.oculus.systemutilities", "name": "Oculus System Utilities", "category": "Protected", "tier": "PROTECTED", "presets": [], "description": "Low-level Horizon OS system utilities and volume/brightness panels."}, {"package": "com.oculus.guardian", "name": "Guardian Boundary Engine", "category": "Protected", "tier": "PROTECTED", "presets": [], "description": "Playspace boundary and passthrough safety guardian system."}, {"package": "com.oculus.guardianresources", "name": "Guardian Resources", "category": "Protected", "tier": "PROTECTED", "presets": [], "description": "Assets and shaders for the Guardian safety boundary."}, {"package": "com.oculus.guardiansetup", "name": "Guardian Setup UI", "category": "Protected", "tier": "PROTECTED", "presets": [], "description": "Room scan and boundary drawing workflow."}, {"package": "com.oculus.ocms", "name": "Oculus Content Management (OCMS)", "category": "Protected", "tier": "PROTECTED", "presets": [], "description": "App library indexing, entitlement verification, and install service."}, {"package": "com.oculus.userserver2", "name": "Horizon Multi-User Server", "category": "Protected", "tier": "PROTECTED", "presets": [], "description": "Active Android/Horizon OS user profile session daemon."}, {"package": "com.oculus.companion.server", "name": "Meta Horizon Phone Companion", "category": "Protected", "tier": "PROTECTED", "presets": [], "description": "Keeps Developer Mode, pairing, and controller calibration accessible."}, {"package": "com.oculus.identitymanagement.service", "name": "Oculus Identity Management", "category": "Protected", "tier": "PROTECTED", "presets": [], "description": "Required by system shell and store-licensed VR games."}, {"package": "com.oculus.deviceauthserver", "name": "Device Authentication Server", "category": "Protected", "tier": "PROTECTED", "presets": [], "description": "Hardware device attestation and entitlement token service."}, {"package": "com.meta.systemui", "name": "Meta Android SystemUI", "category": "Protected", "tier": "PROTECTED", "presets": [], "description": "Core Android SystemUI status bar, notifications, and ADB RSA prompt."}, {"package": "horizonos.platform", "name": "Horizon OS Platform Services", "category": "Protected", "tier": "PROTECTED", "presets": [], "description": "Core Horizon OS SDK runtime platform."}, {"package": "horizonos.openxr.runtimebroker", "name": "Horizon OpenXR Runtime Broker", "category": "Protected", "tier": "PROTECTED", "presets": [], "description": "OpenXR runtime broker required by all VR games, Virtual Desktop, and SteamVR."}, {"package": "oculus.platform", "name": "Oculus Platform SDK", "category": "Protected", "tier": "PROTECTED", "presets": [], "description": "Shared Oculus platform IPC runtime for installed VR titles."}];
    const selected = new Set(PACKAGES.filter(p => p.presets.includes('safe')).map(p => p.package));
    function selectPreset(name) {
      selected.clear();
      if (name !== 'none') PACKAGES.forEach(p => { if (p.tier !== 'PROTECTED' && p.presets.includes(name)) selected.add(p.package); });
      render();
    }
    function togglePkg(pkg) {
      if (selected.has(pkg)) selected.delete(pkg); else selected.add(pkg);
      updateScript();
    }
    function render() {
      const q = document.getElementById('q').value.toLowerCase();
      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      PACKAGES.filter(p => !q || p.package.toLowerCase().includes(q) || p.name.toLowerCase().includes(q) || p.description.toLowerCase().includes(q) || p.category.toLowerCase().includes(q))
        .forEach(p => {
          const locked = p.tier === 'PROTECTED';
          const div = document.createElement('div');
          div.className = 'card' + (locked ? ' locked' : '');
          div.innerHTML = `<input type="checkbox" ${selected.has(p.package)?'checked':''} ${locked?'disabled':''} onchange="togglePkg('${p.package}')">
            <div><div><strong>${p.name}</strong><span class="badge ${p.tier}">${p.tier}</span></div>
            <div class="pkg">${p.package}</div><div class="desc">${p.description}</div></div>`;
          grid.appendChild(div);
        });
      updateScript();
    }
    function buildCmds(mode) {
      const list = PACKAGES.filter(p => selected.has(p.package) && p.tier !== 'PROTECTED').map(p => p.package);
      if (mode === 'restore') return list.map(p => `adb shell pm enable ${p}`).join('\n');
      return list.map(p => `adb shell pm disable-user --user 0 ${p} && adb shell am force-stop ${p}`).join('\n');
    }
    function updateScript() {
      document.getElementById('count').textContent = `${selected.size} packages selected`;
      document.getElementById('script').textContent = buildCmds('disable') || '# Select a preset or package above';
    }
    function copyScript(mode) { navigator.clipboard.writeText(buildCmds(mode)); }
    render();
  </script>
</body>
</html>
